services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
      - tmp-files:/tmp/bot-downloads
    ports:
      - "8081:8081"
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      LOCAL_BOT_API_URL: http://telegram-bot-api:8081
      DOWNLOAD_DIR: /tmp/bot-downloads
      USE_FILE_URI: "1"
    volumes:
      - tmp-files:/tmp/bot-downloads
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

volumes:
  bot-api-data:
  tmp-files:
